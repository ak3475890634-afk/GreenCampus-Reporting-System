

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Campus Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f7f2;
      color: #204b38;
    }
    h1 { color: #167548; }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 20px 0;
    }
    .card {
      background: white;
      border: 1px solid #d4e4d9;
      border-radius: 10px;
      padding: 15px;
      overflow-wrap: anywhere;
    }
    .number { font-size: 28px; font-weight: bold; }
    .complaint { margin: 12px 0; }
    
button {
  background: #c62828;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  padding: 12px 16px;
}

button:hover {
  background: #a51d1d;
}
, button {
      
      padding: 10px;
      margin-top: 8px;
      max-width: 100%;
    }
    .note { color: #665c35; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Green Campus Admin Dashboard</h1>
  <p>Environmental Complaint Management</p>
  <p class="note">
    Demo only: complaints are stored in this browser, not shared
    across students' devices. This page has no secure admin login.
  </p>

  <div class="stats">
    <div class="card">Total Complaints
      <div class="number" id="total">0</div>
    </div>
    <div class="card">Pending
      <div class="number" id="pending">0</div>
    </div>
    <div class="card">In Progress
      <div class="number" id="progress">0</div>
    </div>
    <div class="card">Resolved
      <div class="number" id="resolved">0</div>
    </div>
  </div>

  <h2>Manage Complaints</h2>
  <div id="complaints"></div>

  <script>
    const KEY = "greenCampusComplaints";
    const list = document.getElementById("complaints");

    function loadComplaints() {
      let items = [];
      try {
        items = JSON.parse(localStorage.getItem(KEY) || "[]");
      } catch (e) {
        list.textContent = "Unable to read saved complaints.";
        return;
      }

      document.getElementById("total").textContent = items.length;
      document.getElementById("pending").textContent =
        items.filter(x => (x.status || "Pending") === "Pending").length;
      document.getElementById("progress").textContent =
        items.filter(x => x.status === "In Progress").length;
      document.getElementById("resolved").textContent =
        items.filter(x => x.status === "Resolved").length;

      list.replaceChildren();

      if (!items.length) {
        list.textContent = "No complaints found in this browser.";
        return;
      }

      items.forEach(function (item, index) {
        const card = document.createElement("div");
        card.className = "card complaint";

        const title = document.createElement("h3");
        title.textContent = item.type || "Environmental Issue";

        const id = document.createElement("p");
        id.textContent = "Complaint ID: " +
          (item.complaintId || item.id || "Not assigned");

        const desc = document.createElement("p");
        desc.textContent = "Details: " + (item.description || "");

        const location = document.createElement("p");
        location.textContent = "Location: " + (item.location || "");

        const status = document.createElement("select");
        ["Pending", "In Progress", "Resolved"].forEach(function (s) {
          const option = document.createElement("option");
          option.value = s;
          option.textContent = s;
          status.appendChild(option);
        });
        status.value = item.status || "Pending";
        status.setAttribute("aria-label", "Change complaint status");

        status.addEventListener("change", function () {
          items[index].status = status.value;
          localStorage.setItem(KEY, JSON.stringify(items));
          loadComplaints();
        });

        card.append(title, id, desc, location, status);
        list.appendChild(card);
      });
    }

    loadComplaints();
  </script>
</body>
</html>
