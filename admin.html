
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Campus Admin Dashboard</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f0f7f2;
      color: #204b38;
    }

    header {
      background: #176b45;
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h1 { margin: 0; font-size: 23px; }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .logout {
      background: #c62828;
      color: white;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }

    .stat-card, .panel {
      background: white;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #00000012;
    }

    .stat-card h3 { font-size: 14px; margin: 0 0 10px; }
    .stat-card p { font-size: 28px; font-weight: bold; margin: 0; }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    input, select {
      width: 100%;
      padding: 11px;
      border: 1px solid #c8d7cd;
      border-radius: 6px;
      font-size: 15px;
      background: white;
    }

    .complaint {
      border: 1px solid #e0e9e2;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 13px;
      overflow-wrap: anywhere;
    }

    .complaint h3 { margin-top: 0; }

    .complaint p { line-height: 1.5; }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .update { background: #176b45; color: white; }
    .delete { background: #c62828; color: white; }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #e7f3e9;
      font-size: 12px;
      font-weight: bold;
    }

    #empty { color: #666; text-align: center; padding: 20px; }

    .notice {
      background: #fff4d6;
      color: #654d12;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>🌱 Green Campus Admin</h1>
      <p style="margin-bottom:0">Environmental Issue Reporting System</p>
    </div>
    <button class="logout" id="logoutButton">Logout</button>
  </header>

  <div class="notice">
    Demo project: login protection is client-side only and is not secure
    authentication.
  </div>

  <section class="stats">
    <div class="stat-card">
      <h3>Total Complaints</h3>
      <p id="totalCount">0</p>
    </div>
    <div class="stat-card">
      <h3>Pending</h3>
      <p id="pendingCount">0</p>
    </div>
    <div class="stat-card">
      <h3>In Progress</h3>
      <p id="progressCount">0</p>
    </div>
    <div class="stat-card">
      <h3>Resolved</h3>
      <p id="resolvedCount">0</p>
    </div>
  </section>

  <section class="panel">
    <h2>Manage Complaints</h2>

    <div class="filters">
      <input id="searchInput" type="search"
        placeholder="Search ID, issue, or location">

      <select id="statusFilter">
        <option value="all">All statuses</option>
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Resolved">Resolved</option>
      </select>
    </div>

    <div id="complaintList"></div>
    <p id="empty" hidden>No complaints found.</p>
  </section>

  <script>
    // Redirect if this browser has no admin demo session.
    if (sessionStorage.getItem("greenCampusRole") !== "admin") {
      window.location.replace("login.html");
    }

    const STORAGE_KEY = "greenCampusComplaints";
    const list = document.getElementById("complaintList");
    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");
    const empty = document.getElementById("empty");

    function loadComplaints() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function saveComplaints(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function getStatus(item) {
      return item.status || "Pending";
    }

    function getId(item, index) {
      return item.id || item.complaintId || ("GC-" + (index + 1));
    }

    function render() {
      const complaints = loadComplaints();

      document.getElementById("totalCount").textContent = complaints.length;
      document.getElementById("pendingCount").textContent =
        complaints.filter(c => getStatus(c) === "Pending").length;
      document.getElementById("progressCount").textContent =
        complaints.filter(c => getStatus(c) === "In Progress").length;
      document.getElementById("resolvedCount").textContent =
        complaints.filter(c => getStatus(c) === "Resolved").length;

      const query = searchInput.value.trim().toLowerCase();
      const filter = statusFilter.value;

      const visible = complaints
        .map((item, index) => ({ item, index }))
        .filter(({ item, index }) => {
          const searchable = [
            getId(item, index),
            item.issueType,
            item.issue,
            item.category,
            item.description,
            item.location
          ].filter(Boolean).join(" ").toLowerCase();

          return searchable.includes(query) &&
            (filter === "all" || getStatus(item) === filter);
        });

      list.replaceChildren();
      empty.hidden = visible.length > 0;

      visible.forEach(({ item, index }) => {
        const card = document.createElement("article");
        card.className = "complaint";

        const title = document.createElement("h3");
        title.textContent = (item.issueType || item.issue || item.category || "Environmental Issue")
          + " — " + getId(item, index);

        const status = document.createElement("span");
        status.className = "status";
        status.textContent = getStatus(item);

        const description = document.createElement("p");
        description.textContent = "Description: " + (item.description || "Not provided");

        const location = document.createElement("p");
        location.textContent = "Location: " + (item.location || "Not provided");

        const statusSelect = document.createElement("select");
        ["Pending", "In Progress", "Resolved"].forEach(value => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = value;
          option.selected = getStatus(item) === value;
          statusSelect.appendChild(option);
        });

        const actions = document.createElement("div");
        actions.className = "actions";

        const update = document.createElement("button");
        update.className = "update";
        update.textContent = "Update Status";
        update.addEventListener("click", () => {
          const latest = loadComplaints();
          if (!latest[index]) return;
          latest[index].status = statusSelect.value;
          saveComplaints(latest);
          render();
        });

        const remove = document.createElement("button");
        remove.className = "delete";
        remove.textContent = "Delete";
        remove.addEventListener("click", () => {
          if (!confirm("Delete this complaint permanently from this browser?")) return;
          const latest = loadComplaints();
          latest.splice(index, 1);
          saveComplaints(latest);
          render();
        });

        actions.append(statusSelect, update, remove);
        card.append(title, status, description, location, actions);
        list.appendChild(card);
      });
    }

    searchInput.addEventListener("input", render);
    statusFilter.addEventListener("change", render);

    document.getElementById("logoutButton").addEventListener("click", () => {
      sessionStorage.removeItem("greenCampusRole");
      window.location.replace("login.html");
    });

    render();
  </script>
</body>
</html>
